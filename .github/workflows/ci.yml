name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # Builds dist/*.pbiviz and runs tests/bundle.cjs against the packaged file.
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: pbiviz
          path: dist/*.pbiviz
          if-no-files-found: error
