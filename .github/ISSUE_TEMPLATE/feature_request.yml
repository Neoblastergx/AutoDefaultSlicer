name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How would it look in the format pane, and how would it behave in each Selection mode?
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: I have checked that this does not require an API newer than powerbi-visuals-api 5.3.0 (Report Server compatibility).
        - label: I have checked that this does not need a custom popup or a modal dialog.
